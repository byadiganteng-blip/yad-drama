<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAD Drama</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar">
  <div class="nav-left">
    <a href="index.html" class="logo">YAD Drama</a>
  </div>
  <div class="nav-right">
    <span id="coin-balance" class="coin-badge">💰 0</span>
    <a href="coin.html" class="btn-nav">Koin</a>
    <a href="login.html" id="login-btn" class="btn-nav">Login</a>
    <a href="profile.html" id="profile-btn" class="btn-nav hidden">Profil</a>
  </div>
</header>

<main>
  <div class="hero">
    <h1>Nonton Drama Gratis</h1>
    <p>Dapatkan koin setiap menit nonton · Withdraw ke e-wallet</p>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-cat="all">Semua</button>
    <button class="filter-btn" data-cat="romance">Romance</button>
    <button class="filter-btn" data-cat="action">Action</button>
    <button class="filter-btn" data-cat="comedy">Comedy</button>
  </div>

  <div id="drama-grid" class="drama-grid">
    <div class="loading">Loading...</div>
  </div>
</main>

<footer><p>© 2026 YAD Drama</p></footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, collection, getDocs, query, where, orderBy, limit, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBsplpeXg1-WyO4MtbFNqS6pEUzJ0lh_DA",
  authDomain: "yad-video-editor.firebaseapp.com",
  projectId: "yad-video-editor",
  storageBucket: "yad-video-editor.firebasestorage.app",
  messagingSenderId: "954465770137",
  appId: "1:954465770137:web:25502420bb6a8418bd3608"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Navbar auth state
onAuthStateChanged(auth, async (user) => {
  const balance = document.getElementById('coin-balance');
  const loginBtn = document.getElementById('login-btn');
  const profileBtn = document.getElementById('profile-btn');
  
  if (user) {
    const userDoc = await getDoc(doc(db, 'users', user.uid));
    if (userDoc.exists() && balance) {
      balance.textContent = '💰 ' + (userDoc.data().coins || 0).toLocaleString();
    }
    if (loginBtn) loginBtn.classList.add('hidden');
    if (profileBtn) profileBtn.classList.remove('hidden');
  } else {
    if (loginBtn) loginBtn.classList.remove('hidden');
    if (profileBtn) profileBtn.classList.add('hidden');
  }
});

// Load dramas
const grid = document.getElementById('drama-grid');

async function loadDramas(category = 'all') {
  grid.innerHTML = '<div class="loading">Loading...</div>';
  
  try {
    let q = collection(db, 'dramas');
    if (category !== 'all') {
      q = query(q, where('category', '==', category));
    }
    
    const snapshot = await getDocs(q);
    
    if (snapshot.empty) {
      grid.innerHTML = '<div class="loading">Belum ada drama. Tambah di Firebase Console.</div>';
      return;
    }
    
    grid.innerHTML = '';
    
    snapshot.forEach((d) => {
      const drama = d.data();
      const card = document.createElement('a');
      card.className = 'drama-card';
      card.href = '#';
      card.innerHTML = `
        <img src="${drama.thumbnail || 'https://via.placeholder.com/300x400/ff69b4/fff?text=Drama'}" onerror="this.src='https://via.placeholder.com/300x400/ff69b4/fff?text=No+Image'">
        <div class="drama-card-info">
          <div class="drama-card-title">${drama.title}</div>
          <div class="drama-card-meta">${drama.category || '-'} · ${drama.total_episodes || 0} eps</div>
        </div>
      `;
      
      card.addEventListener('click', async (e) => {
        e.preventDefault();
        const epQ = query(
          collection(db, 'episodes'),
          where('drama_id', '==', d.id),
          limit(1)
        );
        const epSnap = await getDocs(epQ);
        if (!epSnap.empty) {
          window.location.href = 'watch.html?episode=' + epSnap.docs[0].id;
        }
      });
      
      grid.appendChild(card);
    });
  } catch (err) {
    console.error(err);
    grid.innerHTML = '<div class="loading">Error: ' + err.message + '</div>';
  }
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadDramas(btn.dataset.cat);
  });
});

loadDramas();
</script>
</body>
</html>
