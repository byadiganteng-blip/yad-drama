<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - YAD Drama</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar">
  <div class="nav-left"><a href="index.html" class="logo">YAD Drama</a></div>
  <div class="nav-right">
    <span id="coin-balance" class="coin-badge">💰 0</span>
    <button id="logout-btn" class="btn-nav">Logout</button>
  </div>
</header>

<main class="profile-container">
  <div class="profile-card">
    <div class="avatar">👤</div>
    <h1 id="profile-username">Loading...</h1>
    <p id="profile-email">-</p>
  </div>

  <div class="profile-stats">
    <div class="stat-box">
      <span class="stat-label">Koin</span>
      <span class="stat-value" id="profile-coins">0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Total Earned</span>
      <span class="stat-value" id="profile-earned">0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Total Withdrawn</span>
      <span class="stat-value" id="profile-withdrawn">0</span>
    </div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBsplpeXg1-WyO4MtbFNqS6pEUzJ0lh_DA",
  authDomain: "yad-video-editor.firebaseapp.com",
  projectId: "yad-video-editor",
  storageBucket: "yad-video-editor.firebasestorage.app",
  messagingSenderId: "954465770137",
  appId: "1:954465770137:web:25502420bb6a8418bd3608"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  
  const userDoc = await getDoc(doc(db, 'users', user.uid));
  if (userDoc.exists()) {
    const data = userDoc.data();
    document.getElementById('profile-username').textContent = data.username || 'User';
    document.getElementById('profile-email').textContent = data.email;
    document.getElementById('profile-coins').textContent = (data.coins || 0).toLocaleString();
    document.getElementById('profile-earned').textContent = (data.total_earned || 0).toLocaleString();
    document.getElementById('profile-withdrawn').textContent = (data.total_withdrawn || 0).toLocaleString();
    document.getElementById('coin-balance').textContent = '💰 ' + (data.coins || 0).toLocaleString();
  }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await signOut(auth);
  window.location.href = 'index.html';
});
</script>
</body>
</html>
