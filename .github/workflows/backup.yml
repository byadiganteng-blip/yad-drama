name: Backup Firestore

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "backup"
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd scripts
          npm install
      
      - name: Run backup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd scripts
          node backup.js ../backup
      
      - name: Delete old backup release
        run: |
          gh release delete backup-latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create new release
        run: |
          cd backup
          zip -r ../backup.zip .
          cd ..
          gh release create backup-latest \
            --title "Firestore Backup $(date +%Y-%m-%d)" \
            --notes "Auto backup" \
            backup.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
