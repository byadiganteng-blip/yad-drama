<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nonton - YAD Drama</title>
<link rel="stylesheet" href="css/style.css">
<style>
#youtube-player {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
}
.player-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
}
.player-loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 16px;
    z-index: 1;
}
</style>
</head>
<body>
<header class="navbar">
  <div class="nav-left"><a href="index.html" class="logo">YAD Drama</a></div>
  <div class="nav-right">
    <span id="coin-balance" class="coin-badge">💰 0</span>
    <a href="coin.html" class="btn-nav">Koin</a>
  </div>
</header>

<main class="watch-container">
  <div class="player-wrapper">
    <div id="youtube-player"></div>
    <div id="player-loading" class="player-loading">Loading player...</div>
    <div class="coin-overlay">
      <div class="coin-reward-box">
        <span class="coin-icon">💰</span>
        <span id="coin-earned">+0 koin</span>
        <span class="coin-timer" id="watch-timer">00:00</span>
      </div>
    </div>
  </div>

  <div class="episode-info">
    <h1 id="drama-title">Loading...</h1>
    <p id="episode-title">Episode 1</p>
    <div class="reward-info">
      <span>💰 Reward: <strong id="reward-amount">30</strong> koin/hari</span>
      <span id="reward-status">Tonton untuk dapat koin</span>
    </div>
  </div>

  <div class="episode-list">
    <h2>Daftar Episode</h2>
    <div id="episode-list-container" class="episode-grid"></div>
  </div>
</main>

<div id="toast" class="toast hidden"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, increment, addDoc, serverTimestamp, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBsplpeXg1-WyO4MtbFNqS6pEUzJ0lh_DA",
  authDomain: "yad-video-editor.firebaseapp.com",
  projectId: "yad-video-editor",
  storageBucket: "yad-video-editor.firebasestorage.app",
  messagingSenderId: "954465770137",
  appId: "1:954465770137:web:25502420bb6a8418bd3608"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let player;
let rewardTimer = null;
let watchSeconds = 0;
let currentEpisodeId = null;
let sessionEarned = 0;
let isPlaying = false;
let isTabActive = true;
let currentUser = null;
let ytReady = false;
let pendingVideoId = null;

const urlParams = new URLSearchParams(window.location.search);
currentEpisodeId = urlParams.get('episode');

document.addEventListener('visibilitychange', () => {
  isTabActive = !document.hidden;
});

// ============================================================
// YOUTUBE IFRAME API — HARUS di global scope
// ============================================================
window.onYouTubeIframeAPIReady = function() {
  console.log('[YT] API Ready');
  ytReady = true;
  if (pendingVideoId) {
    createPlayer(pendingVideoId);
  }
};

function createPlayer(videoId) {
  console.log('[YT] Creating player for', videoId);
  const loadingEl = document.getElementById('player-loading');
  if (loadingEl) loadingEl.style.display = 'none';
  
  player = new YT.Player('youtube-player', {
    height: '100%',
    width: '100%',
    videoId: videoId,
    playerVars: {
      'autoplay': 0,
      'controls': 1,
      'modestbranding': 1,
      'rel': 0,
      'playsinline': 1,
      'origin': window.location.origin
    },
    events: {
      'onReady': (e) => {
        console.log('[YT] Player ready');
      },
      'onStateChange': (e) => {
        if (e.data === YT.PlayerState.PLAYING) {
          isPlaying = true;
          startTimer();
        } else {
          isPlaying = false;
          stopTimer();
        }
      },
      'onError': (e) => {
        console.error('[YT] Error:', e.data);
        toast('Video error: ' + e.data);
      }
    }
  });
}

// ============================================================
// AUTH STATE
// ============================================================
onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (user) {
    const userDoc = await getDoc(doc(db, 'users', user.uid));
    if (userDoc.exists()) {
      document.getElementById('coin-balance').textContent = 
        '💰 ' + (userDoc.data().coins || 0).toLocaleString();
    }
  }
});

// ============================================================
// LOAD EPISODE
// ============================================================
async function loadEpisode(id) {
  if (!id) { 
    toast('Episode tidak ditemukan'); 
    return; 
  }
  
  const epDoc = await getDoc(doc(db, 'episodes', id));
  if (!epDoc.exists()) { 
    toast('Episode tidak ada'); 
    return; 
  }
  
  const episode = epDoc.data();
  console.log('[Episode]', episode);
  
  const dramaDoc = await getDoc(doc(db, 'dramas', episode.drama_id));
  const drama = dramaDoc.exists() ? dramaDoc.data() : {};
  
  document.getElementById('drama-title').textContent = drama.title || 'Drama';
  document.getElementById('episode-title').textContent = 'Episode ' + (episode.episode_number || 1);
  document.getElementById('reward-amount').textContent = episode.reward_coins || 30;
  
  // Set video ID
  pendingVideoId = episode.youtube_id;
  
  // Kalau YT API sudah ready, langsung create player
  if (ytReady) {
    createPlayer(pendingVideoId);
  }
  // Kalau belum, tunggu onYouTubeIframeAPIReady
  
  loadEpisodeList(episode.drama_id, id);
}

// ============================================================
// TIMER + REWARD
// ============================================================
function startTimer() {
  if (rewardTimer) return;
  console.log('[Timer] Start');
  rewardTimer = setInterval(async () => {
    if (!isPlaying || !isTabActive) return;
    watchSeconds++;
    const m = Math.floor(watchSeconds / 60);
    const s = watchSeconds % 60;
    document.getElementById('watch-timer').textContent = 
      String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    if (watchSeconds % 60 === 0) await rewardCoins();
  }, 1000);
}

function stopTimer() {
  if (rewardTimer) { 
    clearInterval(rewardTimer); 
    rewardTimer = null; 
    console.log('[Timer] Stop');
  }
}

async function rewardCoins() {
  if (!currentUser) { 
    toast('Login dulu untuk dapat koin'); 
    return; 
  }
  
  try {
    const q = query(
      collection(db, 'watch_history'),
      where('user_id', '==', currentUser.uid),
      where('episode_id', '==', currentEpisodeId)
    );
    const snap = await getDocs(q);
    
    let todayReward = 0;
    let existingDocId = null;
    if (!snap.empty) {
      todayReward = snap.docs[0].data().rewarded_coins || 0;
      existingDocId = snap.docs[0].id;
    }
    
    if (todayReward >= 30) {
      document.getElementById('reward-status').textContent = '⏸️ Batas harian tercapai';
      return;
    }
    
    const amount = Math.min(10, 30 - todayReward);
    
    await updateDoc(doc(db, 'users', currentUser.uid), {
      coins: increment(amount),
      total_earned: increment(amount)
    });
    
    await addDoc(collection(db, 'coin_transactions'), {
      user_id: currentUser.uid,
      amount: amount,
      type: 'reward',
      description: 'Reward nonton',
      created_at: serverTimestamp()
    });
    
    if (existingDocId) {
      await updateDoc(doc(db, 'watch_history', existingDocId), {
        watched_seconds: increment(60),
        rewarded_coins: increment(amount),
        last_watched_at: serverTimestamp()
      });
    } else {
      await addDoc(collection(db, 'watch_history'), {
        user_id: currentUser.uid,
        episode_id: currentEpisodeId,
        watched_seconds: 60,
        rewarded_coins: amount,
        last_watched_at: serverTimestamp()
      });
    }
    
    sessionEarned += amount;
    document.getElementById('coin-earned').textContent = '+' + sessionEarned + ' koin';
    document.getElementById('reward-status').textContent = '✅ +' + amount + ' koin';
    toast('💰 +' + amount + ' koin!');
    
    const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
    if (userDoc.exists()) {
      document.getElementById('coin-balance').textContent = 
        '💰 ' + (userDoc.data().coins || 0).toLocaleString();
    }
  } catch (err) { 
    console.error('[Reward]', err); 
  }
}

// ============================================================
// EPISODE LIST
// ============================================================
async function loadEpisodeList(dramaId, currentId) {
  const q = query(collection(db, 'episodes'), where('drama_id', '==', dramaId));
  const snap = await getDocs(q);
  const episodes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  episodes.sort((a, b) => (a.episode_number || 0) - (b.episode_number || 0));
  
  const container = document.getElementById('episode-list-container');
  container.innerHTML = '';
  episodes.forEach(ep => {
    const btn = document.createElement('button');
    btn.className = 'episode-btn' + (ep.id === currentId ? ' active' : '');
    btn.textContent = ep.episode_number;
    btn.onclick = () => window.location.href = 'watch.html?episode=' + ep.id;
    container.appendChild(btn);
  });
}

function toast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 3000);
}

// Load episode
loadEpisode(currentEpisodeId);
</script>

<!-- YouTube IFrame API — HARUS di luar module script -->
<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
